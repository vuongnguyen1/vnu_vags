global
    log stdout format raw local0 info
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 10s
    timeout client  300s
    timeout server  300s
    timeout client-fin 5s
    timeout server-fin 5s
    timeout tunnel  24h

# Port 443 TLS SNI Multiplexer:
# - SNI == vags.vnu.edu.vn -> C# .NET 8 Unified Gateway (Web + SSE + HTTPS CONNECT Proxy) on 127.0.0.1:5031
# - All other SNIs (*.vnu.edu.vn) -> AAPanel Nginx on 127.0.0.1:443
frontend vags_sni_router
    bind *:8443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    acl is_vags_domain req.ssl_sni -i vags.vnu.edu.vn
    use_backend vags_unified_tls if is_vags_domain
    default_backend aapanel_nginx_tls

backend vags_unified_tls
    mode tcp
    server vags_backend_tls 127.0.0.1:5031 check send-proxy inter 5s fall 3 rise 2

backend aapanel_nginx_tls
    mode tcp
    server nginx_https 127.0.0.1:443 check inter 5s fall 3 rise 2

