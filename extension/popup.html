<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>VAGS - VNU Academic Gateway</title>
    <style>
        body { width: 340px; margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; font-size: 13px; }
        .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; }
        .badge { padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #065f46; color: #6ee7b7; }
        .badge.offline { background: #7f1d1d; color: #fca5a5; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
        .row { display: flex; justify-content: space-between; margin: 4px 0; }
        .muted { color: #94a3b8; }
        .btn { width: 100%; border: none; border-radius: 6px; padding: 9px 12px; font-weight: 600; cursor: pointer; margin-top: 6px; font-size: 12px; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-secondary:hover { background: #475569; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div style="font-weight:700;font-size:14px;">🛡️ VNU Academic Gateway</div>
            <div class="muted" style="font-size:11px;">HTTPS vags.vnu.edu.vn:443</div>
        </div>
        <span id="sseStatus" class="badge">SSE Live</span>
    </div>

    <div class="card">
        <div class="row"><span class="muted">Phiên bản Luật:</span><strong id="ruleVersion">Đang tải...</strong></div>
        <div class="row"><span class="muted">Chế độ Xác thực:</span><strong id="authMode">demo</strong></div>
        <div class="row"><span class="muted">Academic Domains:</span><strong id="domainCount">0</strong></div>
        <div class="row"><span class="muted">Tài khoản VNU:</span><strong id="userEmail">Chưa đăng nhập</strong></div>
    </div>

    <button id="btnSync" class="btn btn-primary">🔄 Đồng bộ Tập luật Ngay</button>
    <button id="btnSso" class="btn btn-secondary">🔐 Đăng nhập VNU SSO (Keycloak / Demo)</button>
    <div id="msg" class="muted" style="margin-top:8px;text-align:center;font-size:11px;"></div>

    <script src="popup.js"></script>
</body>
</html>
